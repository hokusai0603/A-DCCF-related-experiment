  # MTLF (Daisy FL Framework)
  mtlf:
    enabled: true               # Master switch for all Daisy FL features
    endpoint: http://192.168.107.5:9887
    triggerOnStartup: false      # Trigger training once after NWDAF startup
    triggerDelay: 10            # seconds to wait before startup trigger
    staticModelUrl: nwdaf_ml_service/ml/artifacts/model_original.npy  # Initial model bundle (pre-cached in ML Service artifacts/initial/)
    accuracyMonitor:
      enabled: true            # Trigger retraining on accuracy degradation
      checkInterval: 50         # seconds between accuracy checks
      deviationThreshold: 1.0   # sMAPE [0,2] > 0.3 triggers retraining
      minSamples: 5             # min ground truth samples before evaluation
      warmupDuration: 155       # seconds to skip checks after start (model cold-start)
      triggerStrategy: consecutive  # "consecutive" or "ema"
      consecutiveBreaches: 3    # required consecutive checks (for consecutive)
      emaAlpha: 0.3             # EMA smoothing factor 0-1 (for ema)
    task:
      TID: "nwdaf_fl_training"
      NUM_ROUNDS: 2
      EVALUATE_INTERVAL: 1
      EVALUATE_INIT_MODEL_MASTER: true
      MIN_WAITING_TIME_MASTER: 5
      MODEL_PATH: "model/model.npy"
      OPERATORS:
        MASTER_SERVER_OPERATOR: ["daisyfl.operator.base.base_server_logic", "BaseServerLogic"]
        CLIENT_OPERATOR: ["daisyfl.operator.base.base_client_logic", "BaseClientLogic"]
      STRATEGIES:
        MASTER_STRATEGY: ["custom_strategy", "EarlyStoppingFedAvg"]
      METRICS_HANDLERS:
        MASTER_METRICS_HANDLER: ["daisyfl.metrics_handler.flat_metrics_handler", "FlatMetricsHandler"]
      SAVE_MODEL: true
      MODEL_META:
        model:
          input_size: 10
          output_size: 2
          num_channels: [32, 64, 64, 64]
          kernel_size: 2
          dropout: 0.2
        inference:
          seq_length: 30
          out_seq_len: 1
          feature_order:
            - total_vol
            - ul_vol
            - dl_vol
            - total_nb_pkts
            - ul_nb_pkts
            - dl_nb_pkts
            - ul_thr
            - dl_thr
            - ul_pkt_thr
            - dl_pkt_thr
          output_fields:
            - ul_vol
            - dl_vol
          preprocessing: log1p_standard_scaler

  # ADRF (Analytics Data Repository Function) — TS 29.575
  adrf:
    url: http://192.168.107.5:9888
    storageThreshold: 1   # per-UE: flush every N notifications from the same UE; 1 = immediate
    fetchBatchSize: 1     # IDs per RetrievalRequest GET; ADRF V0 enforces exactly 1 — do not change
    retrainWindow: 1800   # seconds of history to fetch for retrain (30 min)
    watchdogTimeout: 120  # seconds after last callback before watchdog fires

logger:
  enable: true
  level: info
  reportCaller: false
