  # Analytics model parameters per event type
  analytics:
    ueCommunication:
      samplingInterval: 1   # UPF report period (seconds); governs smf repPeriod  (MVE P0 2026-11-10: was 5)
      inputWindow: 30       # data points fed to ML model (30 × 5s = 2.5 min history)
      outputWindow: 1       # ML service predicts 1 step ahead
      lookbackBuffer: 15     # extra seconds added to query window to absorb jitter (default: samplingInterval)
      # queryLookback = samplingInterval × inputWindow + lookbackBuffer (auto-computed)
      ringBufferSize: 50    # in-memory ring buffer size per UE session; must be >= inputWindow

  # External MTLF Integration
  externalMtlf:
